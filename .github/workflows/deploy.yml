name: Deploy para GitHub Pages

# A publicacao acontece quando a main recebe um merge de release ou hotfix,
# ou manualmente pela aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez: se duas chegarem juntas, a mais recente vence.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build de producao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Gerar dist
        run: npm run build

      - name: Conferir o resultado do build
        run: |
          test -f dist/index.html
          test -f dist/app.css
          test -f dist/app.js
          grep -q 'href="app.css"' dist/index.html
          grep -q 'src="app.js"' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
