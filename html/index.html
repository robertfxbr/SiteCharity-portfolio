<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Esperança Solidária</title>
  <meta name="description" content="A ONG Esperança Solidária apoia pessoas em situação de vulnerabilidade social com ações de inclusão, educação e assistência à comunidade.">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <a class="pular-para-conteudo" href="#app">Pular para o conteúdo</a>

  <header class="cabecalho">

      <a class="marca" href="#/">ONG Esperança&nbsp;Solidária</a>

      <button class="tema-toggle" id="tema-toggle" aria-pressed="false">Tema escuro</button>

      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu">
        <span class="menu-toggle__barra"></span>
        <span class="visually-hidden">Abrir menu</span>
      </button>

      <nav class="menu" id="menu" aria-label="Navegação principal">
        <a class="nav-link" href="#/">Início</a>

       defer garante que os tres estejam avaliados antes do modulo principal,
       sem bloquear a renderizacao do documento. -->
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/relativeTime.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/locale/pt-br.js"></script>

  <script type="module" src="../js/main.js"></script>
