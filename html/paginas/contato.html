<section class="secao">
  <h1>Contato</h1>
  <p>Formulario validado no proprio cliente, sem recarregar o documento.</p>

  <form class="formulario" id="form-contato" novalidate>
    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" autocomplete="name">
      <span class="erro" data-erro="nome"></span>
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <span class="erro" data-erro="email"></span>
    </div>

    <div class="campo">
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="5"></textarea>
      <span class="erro" data-erro="mensagem"></span>
    </div>

    <button class="botao" type="submit">Enviar</button>
    <p class="feedback" id="feedback" role="status"></p>
  </form>
</section>
